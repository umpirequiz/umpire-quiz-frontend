<div class="d-flex align-items-center">
  <div class="input-group mb-3 p-2">
    <label class="me-1">Difficulty</label>
    <mat-icon
      class="help-icon text-black me-3"
      matTooltip="Corresponds to U1-U4 levels (1=beginner, 4=veteran)"
      i18n-matTooltip="@@select-difficulties.tooltip"
      [matTooltipShowDelay]="300"
      [matTooltipTouchGestures]="'on'"
      matTooltipPosition="above">
      help_outline
    </mat-icon>

    <label for="u1" class="form-check-label me-1">1</label>
    <input type="checkbox" class="form-check-input me-2"
           id="u1" name="u1"
           [(ngModel)]="levels.u1"
           (change)="select(u1)">

    <label for="u2" class="form-check-label me-1">2</label>
    <input type="checkbox" class="form-check-input me-2"
           id="u2" name="u2"
           [(ngModel)]="levels.u2"
           (change)="select(u2)">

    <label for="u3" class="form-check-label me-1">3</label>
    <input type="checkbox" class="form-check-input me-2"
           id="u3" name="u3"
           [(ngModel)]="levels.u3"
           (change)="select(u3)">

    <label for="u4" class="form-check-label me-1">4</label>
    <input type="checkbox" class="form-check-input me-2"
           id="u4" name="u4"
           [(ngModel)]="levels.u4"
           (change)="select(u4)">
  </div>

</div>
