<div class="row">
  <div class="col-12">
    <div class="card p-0 p-lg-0 text-black border w-100 mb-4">
      <h5 class="card-header" #questionHeader id="questionHeader">
        Question {{ currentQuestionIndex + 1 }}
      </h5>
      <div class="card-body">
        <app-question [question]="currentQuestion" [gameState]="currentGameState"></app-question>
        <app-answers
          [answers]="currentQuestion.answers"
          [resultsScreen]="false"
          [selectedAnswer]="currentQuestion.selectedAnswer"
          [questionId]="currentQuestion.id"
          (selectedAnswerEvent)="selectAnswer($event)"></app-answers>
        <nav class="mt-2" aria-label="Page navigation">
          <ul class="pagination justify-content-start">
            <li class="page-item" [class.disabled]="currentQuestionIndex === 0">
              <a class="page-link click" (click)="prevQuestion(); scrollTo(questionHeader)"><i
                class="fa-solid fa-angle-left"></i></a>
            </li>
            <li *ngFor="let question of quiz.questions; let i = index" class="page-item"
                [ngClass]="{'active': currentQuestionIndex === i}"
                [class.bg-primary]="isAnswered(i)">
              <a class="page-link click" (click)="goToQuestion(i)"
                 [ngClass]="{'bg-secondary text-white': isAnswered(i) && currentQuestionIndex !== i}">{{ i + 1 }}</a>
            </li>
            <li class="page-item" [class.disabled]="currentQuestionIndex === quiz.questions.length - 1">
              <a class="page-link click" (click)="nextQuestion(); scrollTo(questionHeader)"><i
                class="fa-solid fa-angle-right"></i></a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="card p-0 p-lg-0 text-black border w-100 mb-4">
          <div class="card-header">
            <h6 class="card-title">Progress</h6>
          </div>
          <div class="card-body">
            <p>Questions answered: {{ questionsAnswered }}/{{ quiz.questions.length }}</p>
            <button [ngClass]="allAnswered() ? 'btn btn-success':'btn btn-warning'"
                    (click)="submitAnswers()" routerLink="/quiz/results">Finish{{ allAnswered() ? '!' : '?' }}
            </button>
            <span class="text-danger"> {{ allAnswered() ? '' : '(quiz is incomplete!)' }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
