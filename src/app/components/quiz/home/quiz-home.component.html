<h5>Ready?</h5>
<p>The next quiz will have five questions. Answer them all and then click "Finish" to see the results.</p>
<a routerLink="play">
  <button class="btn btn-outline-primary" (click)="clearQuiz()">Start Quiz</button>
</a>
@if (quizInProgress()) {
  <hr/>
  <p>
    To continue your quiz in progress:
  </p>
  <a routerLink="play">
    <button class="btn btn-outline-primary">Continue Quiz</button>
  </a>
}
