<h5>Ready?</h5>
<p>The next quiz has five questions. Answer them all, then click "Finish" to see the results.</p>
<a routerLink="play">
  <button class="btn btn-primary" (click)="clearQuiz()">Start quiz</button>
</a>
@if (quizInProgress()) {
  <hr/>
  <p>
    To continue your quiz in progress:
  </p>
  <a routerLink="play">
    <button class="btn btn-outline-primary">Continue quiz</button>
  </a>
}
