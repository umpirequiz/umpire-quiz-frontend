<div class="row">
  <div class="col-12">
    <div class="card p-0 text-black border w-100 mb-2">
      <h5 class="card-header">
        Ready?
      </h5>
      <div class="card-body">
        <p>The next quiz has five <b>random</b> questions. Answer them all, then click "Finish" to see the results.</p>
        <p>You can play as often as you want. Each time, you get different questions.</p>
      </div>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-12">
    <div class="card p-0 text-black border w-100 mb-2">
      <h6 class="card-header">
        Options
      </h6>
      <div class="card-body">
        <app-select-difficulties [levels]="levels"/>
      </div>
    </div>
    <div>
      <a routerLink="play">
        <button class="btn btn-primary" (click)="newQuiz()">Start!</button>
      </a>
    </div>
    @if (quizInProgress()) {
      <hr/>
      <p>
        To continue your quiz in progress:
      </p>
      <a routerLink="play">
        <button class="btn btn-outline-primary">Continue quiz</button>
      </a>
    }
  </div>
</div>
