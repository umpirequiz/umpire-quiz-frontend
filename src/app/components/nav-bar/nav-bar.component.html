<nav class="navbar navbar-expand-md shadow p-3 navbar-fixed-top" data-bs-theme="dark" style="background-color: #0d6efd">
  <div class="container-xxl">
    <a class="navbar-brand" routerLink="/home"><i class="fas fa-baseball fa-2x me-3" style="color: #FFFFFF;"></i></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
            aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation"
            i18n-aria-label="@@nav.toggle.label">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLinkActive="active" routerLink="/home" i18n="@@nav.home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLinkActive="active" routerLink="/quiz" i18n="@@nav.quiz">Quiz</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLinkActive="active" routerLink="/contact" i18n="@@nav.contact">Contact</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLinkActive="active" routerLink="/about" i18n="@@nav.about">About</a>
        </li>
        @if (isLoggedIn$ | async) {
          <li class="nav-item">
            <a class="nav-link" routerLinkActive="active" routerLink="/admin" i18n="@@nav.admin">Admin</a>
          </li>
        }
      </ul>
      <div class="ms-auto text-white">
        @if (isLoggedIn$ | async) {
          <span i18n="@@nav.logged.in.as">Logged in as:</span> <b>{{ loggedInUser() }} </b>
          <a (click)="logout()" class="d-fl">
            <button class="btn btn-outline-light m-auto" i18n="@@nav.logout">Log out</button>
          </a>
        } @else {
          <a routerLink="/l ogin" class="d-fl">
            <button class="btn btn-outline-light" i18n="@@nav.login">Login</button>
          </a>
        }
      </div>
      <app-language-switcher/>
    </div>
  </div>
</nav>
