<div class="row">
  <div class="col-1 my-auto" routerLink="/questions/add">
    <label for="all" class="form-check-label m-2">
      <i class="fa-solid fa-square-plus" style='color: #177b00;'></i>
      <span> New</span>
    </label>
  </div>
  <div class="col-1 my-auto">
    <label for="all" class="form-check-label m-2">
      <span>All </span>
      <input type="checkbox" class="form-check-input " id="all" name="all" (click)="toggleAll()">
    </label>
  </div>
  <div class="col-5 my-auto">
    <app-search placeholder="Search question..." (inputChanged)="handleSearchInputChanged($event)"
                (search)="handleSearch($event)"></app-search>
  </div>
  <div class="col-5">
    <mat-paginator [length]="totalItems" [pageIndex]="currentPage"
                   [showFirstLastButtons]="true" [hidePageSize]="false"
                   [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
                   (page)="pageChanged($event)">
    </mat-paginator>
  </div>
</div>
<table class="table table-striped">
  <thead class="thead-dark">
    <tr>
      <th>#</th>
      <th>Active</th>
      <th>Question</th>
      <th class="text-center"><i class="fa-solid fa-gears"></i></th>
    </tr>
  </thead>
  <tbody>
    @for (q of questions; track $index) {
      <tr>
        <td routerLink="{{q.id}}">{{ q.id }}</td>
        <td>{{ q.enabled }}</td>
        <td>{{ q.i18nValue.EN_US }}</td>
        <td class="text-center">
          <div class="btn-group">
            <i routerLink="{{q.id}}" class="m-1 fa-solid fa-circle-info" style='color: #176000;'></i>
            <i routerLink="/questions/{{q.id}}" class="m-1 fa-solid fa-pen-to-square pointer-hand"
               style='color: #0044aa;'></i>
            <i (click)="remove(q.id)" class="m-1 fa-solid fa-trash pointer-hand" style='color: #cc0303;'></i>
          </div>
        </td>
      </tr>
    }
  </tbody>
</table>
